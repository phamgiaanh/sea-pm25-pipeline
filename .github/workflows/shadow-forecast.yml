name: PM25 - G-TH10 shadow forecast

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pm25-gth10-shadow-ledger
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check campaign window and hourly de-duplication
        id: gate
        run: python3 automation/shadow_gate.py forecast

      - name: Set up Python
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install inference dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: python -m pip install -r requirements.txt

      - name: Validate the released pipeline
        if: steps.gate.outputs.enabled == 'true'
        run: PYTHONPATH=src python -m unittest discover -s tests -v

      - name: Issue G-TH10 shadow forecasts
        if: steps.gate.outputs.enabled == 'true'
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: PYTHONPATH=src python -m pm25_pipeline shadow-issue --config config/shadow_gth10.json

      - name: Upload source responses for audit
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gth10-shadow-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/shadow_evidence/
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 9

      - name: Commit append-only forecast ledger
        if: always() && steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/shadow/
          if git diff --cached --quiet; then
            echo 'No new shadow ledger entries.'
          else
            git commit -m 'data: preserve G-TH10 shadow forecast evidence'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
