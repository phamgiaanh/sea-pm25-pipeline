name: PM25 - deployment shadow scoring

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pm25-deployment-shadow-ledger
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Check scoring window
        id: gate
        run: python3 automation/shadow_gate.py score

      - name: Set up Python
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install inference dependencies
        if: steps.gate.outputs.enabled == 'true'
        run: python -m pip install -r requirements.txt

      - name: Match delayed observations and score forecasts
        if: steps.gate.outputs.enabled == 'true'
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: PYTHONPATH=src python -m pm25_pipeline shadow-score --config config/shadow_deployment.json

      - name: Upload ground-truth responses for audit
        if: always() && steps.gate.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-shadow-truth-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/shadow_evidence/
          if-no-files-found: ignore
          retention-days: 14
          compression-level: 9

      - name: Commit latest shadow metrics
        if: always() && steps.gate.outputs.enabled == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/shadow/ artifacts/shadow/
          if git diff --cached --quiet; then
            echo 'No new shadow metrics.'
          else
            git commit -m 'data: update deployment shadow evidence and report'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
